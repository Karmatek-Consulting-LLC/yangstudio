services:
  yangstudio:
    build: .
    ports:
      # Override the host side with YANGSTUDIO_HOST_PORT if 8420 is taken.
      - "${YANGSTUDIO_HOST_PORT:-8420}:8420"
    volumes:
      # YANG repositories and profiles live here; keep it outside the container.
      - yangstudio-data:/data
    environment:
      YANGSTUDIO_DATA: /data
    restart: unless-stopped

volumes:
  yangstudio-data:
