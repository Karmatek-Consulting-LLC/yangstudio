[project]
name = "yangstudio"
version = "0.1.0"
description = "A modern workbench for exploring and operating on YANG models"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyang>=2.6",
    "ncclient>=0.6.15",
    "lxml>=5.3",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "GitPython>=3.1",
    "paramiko>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yangstudio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set has broadened between releases,
# and CI should not go red because a new version turned something on.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # ncclient, lxml and pyang all raise broadly and undocumented; catching
    # narrowly here would mean guessing at their internals.
    "BLE001",
    # A few recovery paths genuinely have nothing to do on failure, and each
    # carries a comment saying so.
    "S110",
    # Nested `with` is often clearer than one long line of context managers.
    "SIM117",
    # FastAPI's dependency idiom is a call in a default argument.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures and assertions read better without these.
"tests/*" = ["S101", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
